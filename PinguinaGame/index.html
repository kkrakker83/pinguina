<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pinguina - Juego de Laberinto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Arial', sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }
    #gameContainer {
      text-align: center;
      max-width: 800px;
      width: 100%;
      padding: 20px;
    }
    h1 {
      color: #00d4ff;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    #gameCanvas {
      border: 4px solid #00d4ff;
      background: #0f3460;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    #ui {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 10px;
    }
    .stat {
      font-size: 18px;
      font-weight: bold;
    }
    .stat-label {
      color: #00d4ff;
    }
    #menu, #gameOverScreen, #levelCompleteScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border-radius: 15px;
      border: 3px solid #00d4ff;
      text-align: center;
      z-index: 10;
    }
    .hidden { display: none; }
    button {
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      margin: 10px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
    }
    button:hover {
      background: #00a8cc;
      transform: scale(1.05);
    }
    #controls {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <h1>🐧 Pinguina - Aventura en el Laberinto 🐧</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
      <div class="stat"><span class="stat-label">Puntos:</span> <span id="scoreDisplay">0</span></div>
      <div class="stat"><span class="stat-label">Nivel:</span> <span id="levelDisplay">1</span></div>
      <div class="stat"><span class="stat-label">Vidas:</span> <span id="livesDisplay">3</span></div>
      <div class="stat"><span class="stat-label">Peces:</span> <span id="fishDisplay">0/0</span></div>
    </div>
    <div id="controls">
      <p><strong>Controles:</strong> Usa las flechas ↑ ↓ ← → o WASD para mover la pingüina</p>
      <p><strong>Objetivo:</strong> Recoge todos los peces y evita a los enemigos</p>
    </div>
    
    <div id="menu">
      <h2>Selecciona Dificultad</h2>
      <button onclick="startGame('easy')">Fácil</button>
      <button onclick="startGame('medium')">Medio</button>
      <button onclick="startGame('hard')">Difícil</button>
    </div>
    
    <div id="gameOverScreen" class="hidden">
      <h2>¡Game Over!</h2>
      <p>Puntuación Final: <span id="finalScore">0</span></p>
      <button onclick="showMenu()">Menú Principal</button>
    </div>
    
    <div id="levelCompleteScreen" class="hidden">
      <h2>¡Nivel Completado!</h2>
      <p>Puntos: <span id="levelScore">0</span></p>
      <button onclick="nextLevel()">Siguiente Nivel</button>
      <button onclick="showMenu()">Menú Principal</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game state
    let gameState = 'menu'; // menu, playing, gameover, levelcomplete
    let difficulty = 'medium';
    let currentLevel = 1;
    let score = 0;
    let lives = 3;
    
    // Grid settings
    const CELL_SIZE = 40;
    const COLS = 20;
    const ROWS = 15;
    
    // Game objects
    let player = null;
    let enemies = [];
    let collectibles = [];
    let maze = [];
    
    // Difficulty settings
    const DIFFICULTY = {
      easy: { enemyCount: 2, enemySpeed: 1.5, lives: 5, pointsPerFish: 10 },
      medium: { enemyCount: 3, enemySpeed: 2, lives: 3, pointsPerFish: 20 },
      hard: { enemyCount: 4, enemySpeed: 2.5, lives: 2, pointsPerFish: 30 }
    };
    
    // Keyboard input
    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      keys[e.code] = true;
    });
    document.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
      keys[e.code] = false;
    });
    
    // Sound effects (simple beep sounds using Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(frequency, duration) {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = frequency;
      oscillator.type = 'sine';
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + duration);
    }
    
    function collectSound() { playSound(800, 0.1); }
    function gameOverSound() { playSound(200, 0.5); }
    function levelCompleteSound() { 
      playSound(523, 0.15);
      setTimeout(() => playSound(659, 0.15), 150);
      setTimeout(() => playSound(784, 0.3), 300);
    }
    function hitSound() { playSound(150, 0.2); }
    
    // Generate maze
    function generateMaze(level) {
      maze = [];
      for (let y = 0; y < ROWS; y++) {
        maze[y] = [];
        for (let x = 0; x < COLS; x++) {
          // Create borders
          if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) {
            maze[y][x] = 1;
          } else {
            maze[y][x] = 0;
          }
        }
      }
      
      // Add internal walls based on level
      const wallDensity = 0.15 + (level * 0.05);
      for (let y = 2; y < ROWS - 2; y += 2) {
        for (let x = 2; x < COLS - 2; x += 2) {
          if (Math.random() < wallDensity) {
            maze[y][x] = 1;
            // Add walls around it randomly
            if (Math.random() < 0.5) maze[y][x + 1] = 1;
            if (Math.random() < 0.5) maze[y + 1][x] = 1;
          }
        }
      }
      
      // Ensure starting position is clear
      maze[1][1] = 0;
      maze[1][2] = 0;
      maze[2][1] = 0;
    }
    
    // Check if position is walkable
    function isWalkable(x, y) {
      const col = Math.floor(x / CELL_SIZE);
      const row = Math.floor(y / CELL_SIZE);
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
      return maze[row][col] === 0;
    }
    
    // Initialize player
    function initPlayer() {
      player = {
        x: CELL_SIZE * 1.5,
        y: CELL_SIZE * 1.5,
        size: CELL_SIZE * 0.8,
        speed: 3,
        direction: 0
      };
    }
    
    // Initialize enemies
    function initEnemies() {
      enemies = [];
      const settings = DIFFICULTY[difficulty];
      const positions = [
        { x: COLS - 2, y: 1 },
        { x: COLS - 2, y: ROWS - 2 },
        { x: COLS / 2, y: ROWS / 2 },
        { x: 1, y: ROWS - 2 }
      ];
      
      for (let i = 0; i < settings.enemyCount; i++) {
        const pos = positions[i];
        enemies.push({
          x: pos.x * CELL_SIZE + CELL_SIZE / 2,
          y: pos.y * CELL_SIZE + CELL_SIZE / 2,
          size: CELL_SIZE * 0.7,
          speed: settings.enemySpeed,
          direction: Math.random() * Math.PI * 2,
          color: ['#ff4444', '#ff8844', '#ff44ff', '#8844ff'][i % 4]
        });
      }
    }
    
    // Initialize collectibles
    function initCollectibles() {
      collectibles = [];
      for (let y = 1; y < ROWS - 1; y++) {
        for (let x = 1; x < COLS - 1; x++) {
          if (maze[y][x] === 0 && Math.random() < 0.15) {
            // Don't place too close to player start
            if (x < 3 && y < 3) continue;
            collectibles.push({
              x: x * CELL_SIZE + CELL_SIZE / 2,
              y: y * CELL_SIZE + CELL_SIZE / 2,
              size: CELL_SIZE * 0.3,
              collected: false
            });
          }
        }
      }
      // Ensure at least 20 collectibles
      while (collectibles.length < 20) {
        const x = Math.floor(Math.random() * (COLS - 2)) + 1;
        const y = Math.floor(Math.random() * (ROWS - 2)) + 1;
        if (maze[y][x] === 0 && (x > 3 || y > 3)) {
          collectibles.push({
            x: x * CELL_SIZE + CELL_SIZE / 2,
            y: y * CELL_SIZE + CELL_SIZE / 2,
            size: CELL_SIZE * 0.3,
            collected: false
          });
        }
      }
    }
    
    // Start game
    function startGame(diff) {
      difficulty = diff;
      currentLevel = 1;
      score = 0;
      lives = DIFFICULTY[diff].lives;
      
      document.getElementById('menu').classList.add('hidden');
      initLevel();
      gameState = 'playing';
      requestAnimationFrame(gameLoop);
    }
    
    function initLevel() {
      generateMaze(currentLevel);
      initPlayer();
      initEnemies();
      initCollectibles();
      updateUI();
    }
    
    function nextLevel() {
      currentLevel++;
      document.getElementById('levelCompleteScreen').classList.add('hidden');
      initLevel();
      gameState = 'playing';
      requestAnimationFrame(gameLoop);
    }
    
    function showMenu() {
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('levelCompleteScreen').classList.add('hidden');
      gameState = 'menu';
    }
    
    // Update player
    function updatePlayer() {
      let dx = 0, dy = 0;
      
      if (keys['arrowup'] || keys['w']) dy = -1;
      if (keys['arrowdown'] || keys['s']) dy = 1;
      if (keys['arrowleft'] || keys['a']) dx = -1;
      if (keys['arrowright'] || keys['d']) dx = 1;
      
      if (dx !== 0 || dy !== 0) {
        const newX = player.x + dx * player.speed;
        const newY = player.y + dy * player.speed;
        
        // Check collision with walls
        const corners = [
          { x: newX - player.size / 2, y: newY - player.size / 2 },
          { x: newX + player.size / 2, y: newY - player.size / 2 },
          { x: newX - player.size / 2, y: newY + player.size / 2 },
          { x: newX + player.size / 2, y: newY + player.size / 2 }
        ];
        
        let canMove = true;
        for (let corner of corners) {
          if (!isWalkable(corner.x, corner.y)) {
            canMove = false;
            break;
          }
        }
        
        if (canMove) {
          player.x = newX;
          player.y = newY;
        }
        
        player.direction = Math.atan2(dy, dx);
      }
    }
    
    // Update enemies
    function updateEnemies() {
      enemies.forEach(enemy => {
        // Simple AI: move randomly with occasional chase
        if (Math.random() < 0.02) {
          // Change direction randomly
          enemy.direction = Math.random() * Math.PI * 2;
        } else if (Math.random() < 0.1) {
          // Chase player
          const dx = player.x - enemy.x;
          const dy = player.y - enemy.y;
          enemy.direction = Math.atan2(dy, dx);
        }
        
        const newX = enemy.x + Math.cos(enemy.direction) * enemy.speed;
        const newY = enemy.y + Math.sin(enemy.direction) * enemy.speed;
        
        // Check if new position is walkable
        if (isWalkable(newX, newY)) {
          enemy.x = newX;
          enemy.y = newY;
        } else {
          // Hit wall, change direction
          enemy.direction = Math.random() * Math.PI * 2;
        }
      });
    }
    
    // Check collisions
    function checkCollisions() {
      // Check collectibles
      collectibles.forEach(item => {
        if (!item.collected) {
          const dx = player.x - item.x;
          const dy = player.y - item.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < player.size / 2 + item.size) {
            item.collected = true;
            score += DIFFICULTY[difficulty].pointsPerFish;
            collectSound();
          }
        }
      });
      
      // Check enemies
      enemies.forEach(enemy => {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < player.size / 2 + enemy.size / 2) {
          lives--;
          hitSound();
          
          if (lives <= 0) {
            gameState = 'gameover';
            gameOverSound();
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
          } else {
            // Reset player position
            player.x = CELL_SIZE * 1.5;
            player.y = CELL_SIZE * 1.5;
          }
        }
      });
      
      // Check level complete
      const remaining = collectibles.filter(item => !item.collected).length;
      if (remaining === 0 && gameState === 'playing') {
        gameState = 'levelcomplete';
        levelCompleteSound();
        document.getElementById('levelScore').textContent = score;
        document.getElementById('levelCompleteScreen').classList.remove('hidden');
      }
    }
    
    // Update UI
    function updateUI() {
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('levelDisplay').textContent = currentLevel;
      document.getElementById('livesDisplay').textContent = lives;
      const remaining = collectibles.filter(item => !item.collected).length;
      document.getElementById('fishDisplay').textContent = 
        `${collectibles.length - remaining}/${collectibles.length}`;
    }
    
    // Draw maze
    function drawMaze() {
      ctx.fillStyle = '#0a1929';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (maze[y][x] === 1) {
            ctx.fillStyle = '#1e3a5f';
            ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            ctx.strokeStyle = '#2a5a8f';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        }
      }
    }
    
    // Draw collectibles
    function drawCollectibles() {
      collectibles.forEach(item => {
        if (!item.collected) {
          // Draw fish
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
          ctx.fill();
          
          // Add shine effect
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(item.x - item.size / 3, item.y - item.size / 3, item.size / 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }
    
    // Draw player
    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.direction);
      
      // Body
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 0, player.size / 2, player.size / 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Belly
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(0, 0, player.size / 3, player.size / 3, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.size / 4, -player.size / 4, player.size / 6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(player.size / 4, -player.size / 4, player.size / 10, 0, Math.PI * 2);
      ctx.fill();
      
      // Beak
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.moveTo(player.size / 2, 0);
      ctx.lineTo(player.size / 1.5, -player.size / 8);
      ctx.lineTo(player.size / 1.5, player.size / 8);
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }
    
    // Draw enemies
    function drawEnemies() {
      enemies.forEach(enemy => {
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size / 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(enemy.x - enemy.size / 4, enemy.y - enemy.size / 6, enemy.size / 6, 0, Math.PI * 2);
        ctx.arc(enemy.x + enemy.size / 4, enemy.y - enemy.size / 6, enemy.size / 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(enemy.x - enemy.size / 4, enemy.y - enemy.size / 6, enemy.size / 10, 0, Math.PI * 2);
        ctx.arc(enemy.x + enemy.size / 4, enemy.y - enemy.size / 6, enemy.size / 10, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    
    // Game loop
    function gameLoop() {
      if (gameState === 'playing') {
        updatePlayer();
        updateEnemies();
        checkCollisions();
        updateUI();
      }
      
      // Draw everything
      drawMaze();
      drawCollectibles();
      drawPlayer();
      drawEnemies();
      
      if (gameState === 'playing') {
        requestAnimationFrame(gameLoop);
      }
    }
  </script>
</body>
</html>
